<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboards - Codinica</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1k8m1o8lIdhSyVQPtfsvURj066v-Z7iHx">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Estilo de la pantalla de bloqueo */
        #login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .login-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .login-logos img {
            max-height: 45px;
            object-fit: contain;
        }

        #login-container h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 22px;
        }

        #login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        #login-container button {
            width: 100%;
            padding: 12px;
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #login-container button:hover {
            background-color: #005a9e;
        }

        #error-msg {
            color: #d83b01;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        /* Estilo del contenedor principal del sitio */
        #dashboard-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
        }

        header {
            background-color: #b3b3b3;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logos {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logos img {
            max-height: 35px;
            object-fit: contain;
        }

        /* Botones de pestañas superiores */
        .header-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* Estilo para la pestaña activa */
        .tab-btn.active {
            background-color: #0078d4;
            border-color: #0078d4;
            font-weight: 600;
        }

        header button.logout-btn {
            background-color: transparent;
            border: 1px solid white;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        header button.logout-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Contenido de las secciones */
        .content-section {
            display: none;
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        .content-section.active {
            display: flex;
        }

        .content-section iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Acceso -->
    <div id="login-container">
        <div class="login-logos">
            <!-- LOGOS EN EL LOGIN (Sustituye los enlaces de Google Drive aquí) -->
            <img src="https://lh3.googleusercontent.com/d/1k8m1o8lIdhSyVQPtfsvURj066v-Z7iHx" alt="Logo Quantiva">
            <img src="https://lh3.googleusercontent.com/d/1mIEFBUwqtvv0LwYIA5NNhbCqRjLvu2t8" alt="Logo Cliente">
        </div>
        <h2>Acceso Restringido</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Introduce tu código de acceso para visualizar el panel.</p>
        <input type="password" id="access-code" placeholder="Código de acceso">
        <button onclick="verificarCodigo()">Entrar</button>
        <div id="error-msg">Código incorrecto. Inténtalo de nuevo.</div>
    </div>

    <!-- Contenedor Principal (Oculto inicialmente) -->
    <div id="dashboard-container">
        <header>
            <div class="header-left">
                <div class="header-logos">
                    <!-- LOGOS EN EL ENCABEZADO (Los mismos enlaces de Google Drive) -->
                    <img src="https://lh3.googleusercontent.com/d/1k8m1o8lIdhSyVQPtfsvURj066v-Z7iHx" alt="Logo BTL">
                    <img src="https://lh3.googleusercontent.com/d/1mIEFBUwqtvv0LwYIA5NNhbCqRjLvu2t8" alt="Logo Cliente">
                </div>
                
                <!-- PESTAÑAS DE NAVEGACIÓN INTERNA -->
                <div class="header-tabs">
                    <button class="tab-btn active" onclick="cambiarPestana('powerbi', this)">📊 Dashboard Kaldun</button>
                    <!-- button class="tab-btn" onclick="cambiarPestana('formulario', this)">📝 Formulario de Auditoría</button> --!>
                </div>
            </div>

            <button class="logout-btn" onclick="cerrarSesion()">Salir</button>
        </header>

        <!-- SECCIÓN 1: POWER BI -->
        <div id="seccion-powerbi" class="content-section active">
            <iframe title="ReportePowerBI" src="https://app.powerbi.com/view?r=eyJrIjoiZmQ2MDFhYjAtZWZjZi00ZjI2LWI2MjAtN2RmMmM2OGZjYzgxIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>

        <!-- SECCIÓN 2: FORMULARIO DE GOOGLE -->
        <div id="seccion-formulario" class="content-section">
            <iframe src="https://script.google.com/macros/s/AKfycbxiYrNCcdeOzAZbVfcPdrcQ3Yk1XJaePHUcylu1f331vlQ_MA52DoRAsQdQKEN_zZ4/exec" title="Objetivos - Equipo Mimesa / BTL"></iframe>
        </div>
    </div>

    <script>
        const CLAVES_VALIDAS = ["KALDUN-001", "2864", "QTV2026"]; 

        function verificarCodigo() {
            const inputVal = document.getElementById("access-code").value.trim();
            const errorMsg = document.getElementById("error-msg");

            if (CLAVES_VALIDAS.includes(inputVal)) {
                document.getElementById("login-container").style.display = "none";
                document.getElementById("dashboard-container").style.display = "flex";
                errorMsg.style.display = "none";
            } else {
                errorMsg.style.display = "block";
            }
        }

        document.getElementById("access-code").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarCodigo();
            }
        });

        function cambiarPestana(seccion, boton) {
            document.querySelectorAll('.content-section').forEach(sec => {
                sec.classList.remove('active');
            });

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            if (seccion === 'powerbi') {
                document.getElementById('seccion-powerbi').classList.add('active');
            } else if (seccion === 'formulario') {
                document.getElementById('seccion-formulario').classList.add('active');
            }

            boton.classList.add('active');
        }

        function cerrarSesion() {
            document.getElementById("dashboard-container").style.display = "none";
            document.getElementById("login-container").style.display = "block";
            document.getElementById("access-code").value = "";
            cambiarPestana('powerbi', document.querySelector('.tab-btn'));
        }
    </script>

</body>
</html>
